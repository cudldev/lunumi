name: Deploy Lunumi to GitHub Pages
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify-feature:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
      - name: Build pull request
        run: npm run build
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Checkout data builder
        uses: actions/checkout@v4
        with:
          path: data-pipeline
      - name: Restore last generated Helsinki dataset
        uses: actions/cache/restore@v4
        with:
          path: .cache/osm/helsinki-metro.json
          key: lunumi-helsinki-osm-${{ github.run_id }}
          restore-keys: lunumi-helsinki-osm-
      - name: Check whether OSM data needs refreshing
        id: osm-cache
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" || ! -s .cache/osm/helsinki-metro.json ]]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Osmium and generate Helsinki metro data
        if: steps.osm-cache.outputs.refresh == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          mkdir -p .cache/osm
          curl --fail --location --retry 3 --output .cache/osm/finland-latest.osm.pbf https://download.geofabrik.de/europe/finland-latest.osm.pbf
          node data-pipeline/scripts/build-osm-food-data.mjs .cache/osm/finland-latest.osm.pbf .cache/osm/helsinki-metro.json
          rm .cache/osm/finland-latest.osm.pbf
      - name: Save refreshed Helsinki dataset cache
        if: steps.osm-cache.outputs.refresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/osm/helsinki-metro.json
          key: lunumi-helsinki-osm-${{ github.run_id }}
      - name: Add only filtered OSM data to both sites
        run: |
          mkdir -p public/data staging/public/data
          cp .cache/osm/helsinki-metro.json public/data/helsinki-metro.json
          cp .cache/osm/helsinki-metro.json staging/public/data/helsinki-metro.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
      - name: Build
        run: npm run build
      - name: Install staging dependencies
        working-directory: staging
        run: npm ci
      - name: Typecheck and test staging
        working-directory: staging
        run: |
          npm run typecheck
          npm test
      - name: Build staging site
        working-directory: staging
        env:
          VITE_BASE_PATH: /lunumi/staging/
        run: npm run build -- --outDir ../dist/staging
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
