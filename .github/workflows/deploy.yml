name: Deploy Lunumi to GitHub Pages
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true
jobs:
  verify-feature:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
      - name: Build pull request
        run: npm run build
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging
      - name: Checkout public restaurant directory
        run: git clone --depth 1 https://github.com/cudldev/finland-restaurant-data.git restaurant-data
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Add committed Helsinki data to both sites when available
        run: |
          if [[ -s public/data/helsinki-metro.json ]]; then
            mkdir -p staging/public/data
            cp public/data/helsinki-metro.json staging/public/data/helsinki-metro.json
          else
            echo "No committed Helsinki dataset found; the app will use its online search fallback."
          fi
      - name: Add the verified restaurant directory to both sites
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('restaurant-data/data/restaurants.json','utf8'));if(d.schema!==2||!Array.isArray(d.places)||d.places.length===0)throw new Error('Invalid public restaurant directory');if(d.places.some(p=>!Number.isFinite(p.lat)||!Number.isFinite(p.lon)))throw new Error('A directory record is missing coordinates');console.log('Publishing '+d.places.length+' verified restaurant locations.');"
          mkdir -p public/data staging/public/data
          cp restaurant-data/data/restaurants.json public/data/restaurant-directory.json
          cp restaurant-data/data/restaurants.json staging/public/data/restaurant-directory.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
      - name: Build
        env:
          VITE_MENU_READER_URL: ${{ vars.MENU_READER_WORKER_URL_LIVE }}
        run: npm run build
      - name: Install staging dependencies
        working-directory: staging
        run: npm ci
      - name: Typecheck and test staging
        working-directory: staging
        run: |
          npm run typecheck
          npm test
      - name: Build staging site
        working-directory: staging
        env:
          VITE_BASE_PATH: /lunumi/staging/
          VITE_MENU_READER_URL: ${{ vars.MENU_READER_WORKER_URL_STAGING }}
        run: npm run build -- --outDir ../dist/staging
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
