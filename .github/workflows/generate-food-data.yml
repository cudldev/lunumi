name: Generate Helsinki restaurant data
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/generate-food-data.yml
      - scripts/build-osm-food-data.mjs
permissions:
  contents: read
jobs:
  generate:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Lunumi
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: Download Finland OpenStreetMap extract
        run: |
          mkdir -p .cache/osm
          curl --fail --location --retry 3 --output .cache/osm/finland-latest.osm.pbf https://download.geofabrik.de/europe/finland-latest.osm.pbf
      - name: Generate filtered Helsinki metro dataset
        run: node scripts/build-osm-food-data.mjs .cache/osm/finland-latest.osm.pbf public/data/helsinki-metro.json
      - name: Keep artifact small
        run: test "$(wc -c < public/data/helsinki-metro.json)" -le 25000000
      - name: Upload dataset for manual use
        uses: actions/upload-artifact@v4
        with:
          name: helsinki-metro-restaurant-data
          path: public/data/helsinki-metro.json
          if-no-files-found: error
          retention-days: 1
