name: Deploy Lunumi menu reader
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate restaurant host allowlist
        run: npm run menu-reader:hosts
  deploy-staging:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging' && vars.MENU_READER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out the current official restaurant directory
        run: git clone --depth 1 https://github.com/cudldev/finland-restaurant-data.git restaurant-data
      - name: Deploy menu reader Worker
        run: |
          node scripts/build-menu-reader-hosts.mjs public/data/helsinki-metro.json restaurant-data/data/restaurants.json
          npm run menu-reader:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
